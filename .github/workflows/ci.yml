name: CI Pipeline

on:
  push:
    branches:
      - master
      - main
      - 'v*'
      - 'release/**'
  pull_request:
    branches:
      - master
      - main

jobs:
  analyze_and_test:
    name: Flutter Analyze & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test --coverage

      - name: Verify pub.dev Package (Dry Run)
        run: flutter pub publish --dry-run

  example_build_check:
    name: Verify Example App Build
    runs-on: ubuntu-latest
    needs: analyze_and_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android APK (Example App)
        run: |
          cd example
          flutter pub get
          flutter build apk --debug
